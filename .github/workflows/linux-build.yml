name: Linux build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "CMakeLists.txt", "patches/**", "encrypted/**", ".github/**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build libsdl2-dev libvulkan-dev zlib1g-dev glslang-dev glslang-tools spirv-tools zstd clang
      - uses: ./.github/actions/prepare
        with:
          lift-key: ${{ secrets.FP_LIFT_KEY }}
      - name: Verify bounded stall capture
        run: |
          c++ -std=c++17 -O2 tests/stall_trace.cpp -o /tmp/stall-trace
          /tmp/stall-trace
          python3 tests/stall_trace_backend.py
      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFP_BUILD_GAME=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSPU_DIR="$PWD/private/lift/spu" -DFP_OVERLAY_DIR="$PWD/private/lift/overlays"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/native --target MyGameRecomp -j "$(nproc)" -- -k 0 2>&1 | tee build.log | grep -E "error:|FAILED|Linking" || true
          find build/native -name fp_native -type f -perm -u+x | grep -q .
      - name: Error summary
        if: failure()
        run: |
          grep -hE "error:" build.log | sed -E 's#^.*/(third_party|src|private)/#\1/#' | sort | uniq -c | sort -rn | head -80 || true
          echo "--- linker ---"
          grep -E "Undefined symbols|referenced from|undefined reference|ld: |duplicate symbol|  \"_" build.log | sort -u | head -150 || true
      - name: Package
        if: success()
        run: |
          exe=$(find build/native -name fp_native -type f -perm -u+x | head -1)
          mkdir -p out && cp "$exe" out/fp_native && strip --strip-debug out/fp_native
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: fat-princess-linux
          path: out/
          retention-days: 14
